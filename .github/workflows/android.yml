name: Android foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install selected SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build and verify
        run: bash ./gradlew qualityCheck :app:assembleDebug :app:assembleRelease :feature:spike:assembleDebugAndroidTest --no-daemon
